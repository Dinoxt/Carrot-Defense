<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Carrot Defense</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <style>
        /* Base canvas reset and font styling */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght=400;700;900&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            overflow: hidden;
            background-color: #4d7c0f; /* lime-700 fallback */
            touch-action: none; /* Prevents pull-to-refresh and scrolling on mobile */
        }
        canvas {
            display: block;
        }
        .text-glow {
            text-shadow: 0 0 20px rgba(249, 115, 22, 0.6);
        }
    </style>
</head>
<body class="text-slate-100 select-none">

    <!-- Main Canvas -->
    <canvas id="gameCanvas" class="absolute top-0 left-0 w-full h-full z-0"></canvas>
    
    <!-- Heads Up Display (HUD) -->
    <div id="ui" class="absolute top-0 left-0 w-full h-full z-10 pointer-events-none flex flex-col justify-between p-4 md:p-6">
        <div class="flex justify-between items-start max-w-5xl w-full mx-auto relative">
            <!-- Score Counter -->
            <div class="bg-black/40 rounded-2xl p-3 px-6 backdrop-blur-md border border-white/10 shadow-xl transition-transform duration-200" id="scoreCard">
                <p class="text-xs text-lime-400 font-bold uppercase tracking-widest mb-1">Score</p>
                <p id="scoreDisplay" class="text-4xl font-black leading-none">0</p>
            </div>
            
            <!-- Pause / Menu Button (Hidden initially) -->
            <button id="pauseBtn" class="hidden pointer-events-auto absolute left-1/2 -translate-x-1/2 top-0 bg-black/40 hover:bg-black/60 rounded-2xl p-3 px-5 backdrop-blur-md border border-white/10 shadow-xl transition-transform duration-200 active:scale-95 flex items-center gap-2 group focus:outline-none">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-slate-300 group-hover:text-white transition-colors" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M6 4h4v16H6zM14 4h4v16h-4z" />
                </svg>
                <span class="text-slate-300 group-hover:text-white font-bold text-sm tracking-wider uppercase transition-colors hidden sm:inline-block">Pause</span>
            </button>

            <!-- Lives Counter -->
            <div class="bg-black/40 rounded-2xl p-3 px-6 backdrop-blur-md border border-white/10 shadow-xl text-right transition-transform duration-200" id="livesCard">
                <p class="text-xs text-rose-400 font-bold uppercase tracking-widest mb-1">Lives</p>
                <p id="livesDisplay" class="text-4xl font-black leading-none">10</p>
            </div>
        </div>
    </div>

    <!-- Start & Game Over Menu Overlay -->
    <div id="menu" class="absolute top-0 left-0 w-full h-full z-20 flex items-center justify-center bg-black/70 backdrop-blur-sm transition-opacity duration-300">
        <div class="bg-slate-900/90 p-8 md:p-10 rounded-3xl shadow-2xl text-center border border-slate-700 max-w-sm w-full mx-4 transform transition-transform scale-100 flex flex-col items-center">
            <div class="mb-6">
                <h1 id="menuTitle" class="text-5xl font-black text-transparent bg-clip-text bg-gradient-to-br from-orange-400 to-rose-500 mb-2 text-glow">Carrot Defense</h1>
                <p id="menuSubtitle" class="text-slate-400 text-sm md:text-base">Protect the garden from mutant veggies!</p>
            </div>
            
            <!-- Final Score Display (Hidden initially) -->
            <div id="finalScoreContainer" class="hidden mb-6 bg-slate-800 rounded-xl p-4 border border-slate-700 w-full">
                <p class="text-slate-400 text-sm font-bold uppercase tracking-wider mb-1">Final Score</p>
                <p id="finalScore" class="text-4xl font-black text-lime-400">0</p>
            </div>

            <!-- Primary Action Button (Start/Resume/Restart) -->
            <button id="startBtn" class="pointer-events-auto w-full py-4 bg-gradient-to-r from-orange-500 to-rose-500 hover:from-orange-400 hover:to-rose-400 text-white rounded-2xl font-black text-xl shadow-lg shadow-orange-500/30 transform transition hover:-translate-y-1 active:translate-y-0 active:scale-95 focus:outline-none">
                PLAY GAME
            </button>

            <!-- Secondary Action Button (Quit to Menu) -->
            <button id="quitBtn" class="hidden pointer-events-auto mt-4 w-full py-3 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl font-bold text-lg shadow-lg transform transition hover:-translate-y-0.5 active:translate-y-0 active:scale-95 focus:outline-none">
                QUIT TO MENU
            </button>

            <!-- Instructions -->
            <div id="instructions" class="mt-6 flex flex-col items-center text-xs text-slate-500 space-y-2">
                <p>🖱️ Drag mouse or touch screen to move</p>
                <p>🔫 Rabbit auto-fires carrots FAST!</p>
                <p>🥕 Collect stars to upgrade to 4, 5, and more carrots!</p>
            </div>
        </div>
    </div>

    <script>
        // --- Core Setup ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d', { alpha: false }); // Optimize for solid background
        
        // UI Elements
        const menu = document.getElementById('menu');
        const menuTitle = document.getElementById('menuTitle');
        const menuSubtitle = document.getElementById('menuSubtitle');
        const startBtn = document.getElementById('startBtn');
        const quitBtn = document.getElementById('quitBtn');
        const pauseBtn = document.getElementById('pauseBtn');
        const scoreDisplay = document.getElementById('scoreDisplay');
        const livesDisplay = document.getElementById('livesDisplay');
        const finalScoreContainer = document.getElementById('finalScoreContainer');
        const finalScore = document.getElementById('finalScore');
        const instructions = document.getElementById('instructions');
        
        // Game State Variables
        let isPlaying = false;
        let isPaused = false;
        let animationId;
        let score = 0;
        let lives = 10;
        let frames = 0;
        let spawnRate = 60; // Initial frames between enemy spawns
        let shakeAmount = 0;
        
        // Entity Arrays
        let carrots = [];
        let enemies = [];
        let particles = [];
        let floatingTexts = [];
        let backgroundBushes = [];
        let powerUps = []; 
        let weaponLevel = 3; // Starts firing 3 carrots at once

        // --- Responsive Canvas Setup ---
        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            
            // Re-generate background decor on resize for good coverage
            backgroundBushes = [];
            for(let i=0; i<25; i++) {
                backgroundBushes.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    radius: Math.random() * 40 + 10,
                    opacity: Math.random() * 0.15 + 0.05
                });
            }
            
            // Keep player on screen if resized
            if (player) {
                player.y = canvas.height - 80;
                player.targetX = Math.min(player.targetX, canvas.width - player.radius);
            }
        }
        window.addEventListener('resize', resize);
        

        // --- Audio System ---
        let audioInitialized = false;
        let shootSynth, hitSynth, hurtSynth, overSynth, powerUpSynth, bgmSynth, bgmSequence; 
        
        // Throttling timers
        let lastHitTime = 0;
        let lastHurtTime = 0;

        function initAudio() {
            shootSynth = new Tone.PolySynth(Tone.Synth, {
                oscillator: { type: "square" },
                envelope: { attack: 0.005, decay: 0.1, sustain: 0, release: 0.1 }
            }).toDestination();
            shootSynth.volume.value = -18;

            hitSynth = new Tone.MembraneSynth({
                pitchDecay: 0.05,
                octaves: 4,
                oscillator: { type: "sine" },
                envelope: { attack: 0.001, decay: 0.2, sustain: 0, release: 0.1 }
            }).toDestination();
            hitSynth.volume.value = -10;

            hurtSynth = new Tone.NoiseSynth({
                noise: { type: "brown" },
                envelope: { attack: 0.01, decay: 0.3, sustain: 0 }
            }).toDestination();
            hurtSynth.volume.value = -10;

            overSynth = new Tone.Synth({
                oscillator: { type: "triangle" },
                envelope: { attack: 0.1, decay: 0.2, sustain: 0.5, release: 1 }
            }).toDestination();
            overSynth.volume.value = -8;

            powerUpSynth = new Tone.PolySynth(Tone.Synth, {
                oscillator: { type: "sine" },
                envelope: { attack: 0.05, decay: 0.1, sustain: 0.3, release: 1 }
            }).toDestination();
            powerUpSynth.volume.value = -12;

            bgmSynth = new Tone.PolySynth(Tone.Synth, {
                oscillator: { type: "triangle" },
                envelope: { attack: 2, decay: 1, sustain: 0.8, release: 3 }
            }).toDestination();
            bgmSynth.volume.value = -22; // Very soft volume

            // Soft 4-chord progression loop (C, Am, F, G)
            const chords = [
                ["C3", "G3", "E4"], 
                ["A2", "E3", "C4"], 
                ["F2", "C3", "A3"], 
                ["G2", "D3", "B3"]
            ];
            
            bgmSequence = new Tone.Sequence((time, chord) => {
                bgmSynth.triggerAttackRelease(chord, "1m", time);
            }, chords, "1m"); // Plays one chord per measure
            Tone.Transport.bpm.value = 75; // Slow, relaxing tempo
        }

        function playShoot() { if(shootSynth) shootSynth.triggerAttackRelease("G5", "32n", Tone.now()); }
        
        function playHit() { 
            if(hitSynth) {
                const now = Tone.now();
                if (now - lastHitTime > 0.05) { // Throttle to max 20 hits per second
                    hitSynth.triggerAttackRelease("C2", "16n", now);
                    lastHitTime = now;
                }
            } 
        }
        
        function playHurt() { 
            if(hurtSynth) {
                const now = Tone.now();
                if (now - lastHurtTime > 0.1) {
                    hurtSynth.triggerAttackRelease("8n", now);
                    lastHurtTime = now;
                }
            } 
        }
        
        function playPowerUpSound() { 
            if(powerUpSynth) { 
                const now = Tone.now(); 
                powerUpSynth.triggerAttackRelease(["C5", "E5", "G5"], "8n", now); 
            } 
        } 
        function playGameOver() {
            if(overSynth) {
                const now = Tone.now();
                overSynth.triggerAttackRelease("E3", "8n", now);
                overSynth.triggerAttackRelease("Eb3", "8n", now + 0.3);
                overSynth.triggerAttackRelease("D3", "8n", now + 0.6);
                overSynth.triggerAttackRelease("C3", "1n", now + 0.9);
            }
        }

        // --- Player Setup ---
        const player = {
            x: window.innerWidth / 2,
            y: window.innerHeight - 80,
            targetX: window.innerWidth / 2,
            radius: 25,
            shootPulse: 0,
            hitFlash: 0
        };

        // --- Input Handling (Mouse & Touch) ---
        function updateTargetX(clientX) {
            player.targetX = Math.max(player.radius, Math.min(canvas.width - player.radius, clientX));
        }

        canvas.addEventListener('mousemove', (e) => {
            if(isPlaying) updateTargetX(e.clientX);
        });

        canvas.addEventListener('touchmove', (e) => {
            if(!isPlaying) return;
            e.preventDefault(); // Prevent scrolling
            updateTargetX(e.touches[0].clientX);
        }, { passive: false });

        canvas.addEventListener('touchstart', (e) => {
            if(!isPlaying) return;
            updateTargetX(e.touches[0].clientX);
        }, { passive: false });


        // --- Spawning Logic ---
        function spawnEnemy() {
            const rand = Math.random();
            let x = Math.random() * (canvas.width - 60) + 30;
            let y = -50;
            
            let radius = 22;
            let vy = 2 + (score / 400); // Progressively get faster
            let color = '#a855f7'; // Purple Turnip
            let type = 'normal';
            let hp = 1;

            if (rand < 0.25) {
                // Spicy Radish
                radius = 16;
                vy *= 1.7;
                color = '#ef4444'; 
                type = 'fast';
                hp = 1;
            } else if (rand < 0.45) {
                // Big Mutant
                radius = 34;
                vy *= 0.75;
                color = '#3b82f6';
                type = 'tank';
                hp = 3;
            }

            enemies.push({ 
                x, y, radius, vy, color, type, hp, maxHp: hp,
                initialX: x, 
                wobbleOffset: Math.random() * Math.PI * 2 
            });
        }

        function spawnPowerUp() { 
            let x = Math.random() * (canvas.width - 60) + 30;
            powerUps.push({
                x: x, y: -30, radius: 15, vy: 2.5,
                rotation: 0
            });
        }

        function createExplosion(x, y, color) {
            for(let i=0; i<12; i++) {
                particles.push({
                    x: x, y: y,
                    vx: (Math.random() - 0.5) * 10,
                    vy: (Math.random() - 0.5) * 10,
                    life: 1.0,
                    decay: 0.02 + Math.random() * 0.03,
                    color: color,
                    size: Math.random() * 6 + 2
                });
            }
        }

        class FloatingText {
            constructor(x, y, text, color) {
                this.x = x;
                this.y = y;
                this.text = text;
                this.color = color;
                this.life = 1.0;
                this.vy = -1.5;
            }
            update() {
                this.y += this.vy;
                this.life -= 0.025;
            }
            draw(ctx) {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.life);
                ctx.fillStyle = this.color;
                ctx.font = 'bold 22px Inter, sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(this.text, this.x, this.y);
                ctx.restore();
            }
        }

        // --- Main Update Logic ---
        function update() {
            frames++;

            // Dynamic Enemy Spawn rates based on score
            let currentSpawnRate = Math.max(20, spawnRate - Math.floor(score / 50));
            if (frames % currentSpawnRate === 0) {
                spawnEnemy();
            }

            // Spawn Power Ups occasionally 
            if (Math.random() < 0.003) { 
                spawnPowerUp();
            }

            // 1. Move Player smoothly towards target
            player.x += (player.targetX - player.x) * 0.2;

            if(player.shootPulse > 0) player.shootPulse--;
            if(player.hitFlash > 0) player.hitFlash--;

            // 2. Auto-Shooting
            let shootInterval = 6;
            if (frames % shootInterval === 0) {
                const spreadAngle = 7;
                for (let i = 0; i < weaponLevel; i++) {
                    let angleOffset = (i - (weaponLevel - 1) / 2) * spreadAngle;
                    let rad = angleOffset * Math.PI / 180;
                    let vx = Math.sin(rad) * 11;
                    let vy = -Math.cos(rad) * 16;
                    carrots.push({x: player.x, y: player.y - 25, vx: vx, vy: vy});
                }
                playShoot();
                player.shootPulse = 6;
            }

            // 3. Update Carrots
            for (let i = carrots.length - 1; i >= 0; i--) {
                carrots[i].x += carrots[i].vx; 
                carrots[i].y += carrots[i].vy;
                if (carrots[i].y < -20 || carrots[i].x < -20 || carrots[i].x > canvas.width + 20) { 
                    carrots.splice(i, 1);
                }
            }

            // 4. Update Power Ups
            for (let i = powerUps.length - 1; i >= 0; i--) {
                let p = powerUps[i];
                p.y += p.vy;
                p.rotation += 0.05;

                if (p.y > canvas.height + p.radius) {
                    powerUps.splice(i, 1);
                    continue;
                }

                let dist = Math.hypot(p.x - player.x, p.y - player.y);
                if (dist < p.radius + player.radius) {
                    playPowerUpSound();
                    
                    if (weaponLevel < 4) {
                        weaponLevel++;
                        floatingTexts.push(new FloatingText(player.x, player.y - 50, `${weaponLevel} CARROTS!`, "#fbbf24"));
                    } else {
                        score += 50;
                        scoreDisplay.innerText = score;
                        floatingTexts.push(new FloatingText(player.x, player.y - 50, "MAX POWER! +50", "#fbbf24"));
                    }
                    
                    createExplosion(p.x, p.y, "#fbbf24");
                    powerUps.splice(i, 1);
                }
            }

            // 5. Update Enemies
            for (let i = enemies.length - 1; i >= 0; i--) {
                let e = enemies[i];
                e.y += e.vy;
                
                let wobbleFreq = e.type === 'fast' ? 0.1 : 0.04;
                e.x = e.initialX + Math.sin(frames * wobbleFreq + e.wobbleOffset) * (e.type === 'tank' ? 15 : 25);

                // Reached bottom
                if (e.y > canvas.height + e.radius) {
                    enemies.splice(i, 1);
                    loseLife();
                    continue;
                }

                // Hit player
                let distToPlayer = Math.hypot(e.x - player.x, e.y - player.y);
                if (distToPlayer < e.radius + player.radius) {
                    createExplosion(e.x, e.y, e.color);
                    enemies.splice(i, 1);
                    loseLife();
                    continue;
                }

                // Hit by carrot
                for (let j = carrots.length - 1; j >= 0; j--) {
                    let c = carrots[j];
                    let distToCarrot = Math.hypot(e.x - c.x, e.y - c.y);
                    
                    if (distToCarrot < e.radius + 8) {
                        carrots.splice(j, 1);
                        e.hp--;
                        playHit();
                        
                        for(let k=0; k<3; k++) {
                            particles.push({
                                x: c.x, y: c.y,
                                vx: (Math.random() - 0.5) * 6,
                                vy: (Math.random() - 0.5) * 6,
                                life: 0.8,
                                decay: 0.05,
                                color: '#f97316',
                                size: Math.random() * 3 + 1
                            });
                        }

                        if (e.hp <= 0) {
                            let value = e.type === 'tank' ? 30 : (e.type === 'fast' ? 20 : 10);
                            score += value;
                            scoreDisplay.innerText = score;
                            
                            if (score % 100 === 0) {
                                const scoreCard = document.getElementById('scoreCard');
                                scoreCard.classList.add('scale-110', 'bg-lime-500/50');
                                setTimeout(() => scoreCard.classList.remove('scale-110', 'bg-lime-500/50'), 200);
                            }

                            createExplosion(e.x, e.y, e.color);
                            floatingTexts.push(new FloatingText(e.x, e.y, `+${value}`, e.color));
                            enemies.splice(i, 1);
                            break;
                        }
                    }
                }
            }

            // 6. Update Particles
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life -= p.decay;
                if (p.life <= 0) {
                    particles.splice(i, 1);
                }
            }

            // 7. Update Floating Text Animations
            for (let i = floatingTexts.length - 1; i >= 0; i--) {
                let ft = floatingTexts[i];
                ft.update();
                if (ft.life <= 0) {
                    floatingTexts.splice(i, 1);
                }
            }
        }

        // --- Drawing Logic ---
        function draw() {
            // 1. Draw Background
            ctx.fillStyle = '#4d7c0f'; // Solid dark green
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Draw parallax background bushes
            backgroundBushes.forEach(b => {
                b.y += 1 + (score/2000); 
                if (b.y > canvas.height + b.radius) {
                    b.y = -b.radius;
                    b.x = Math.random() * canvas.width;
                }
                ctx.fillStyle = `rgba(0, 0, 0, ${b.opacity})`;
                ctx.beginPath();
                ctx.arc(b.x, b.y, b.radius, 0, Math.PI*2);
                ctx.fill();
            });

            // 2. Apply Screen Shake
            if (shakeAmount > 0) {
                ctx.save();
                let dx = (Math.random() - 0.5) * shakeAmount;
                let dy = (Math.random() - 0.5) * shakeAmount;
                ctx.translate(dx, dy);
                shakeAmount *= 0.9;
                if (shakeAmount < 0.5) shakeAmount = 0;
            }

            // Draw PowerUps 
            powerUps.forEach(p => {
                ctx.save();
                ctx.translate(p.x, p.y);
                ctx.rotate(p.rotation);
                ctx.fillStyle = '#fde047'; 
                ctx.shadowBlur = 15;
                ctx.shadowColor = '#eab308'; 
                ctx.beginPath();
                for (let i = 0; i < 5; i++) {
                    ctx.lineTo(Math.cos((18 + i * 72) / 180 * Math.PI) * p.radius,
                               -Math.sin((18 + i * 72) / 180 * Math.PI) * p.radius);
                    ctx.lineTo(Math.cos((54 + i * 72) / 180 * Math.PI) * (p.radius * 0.4),
                               -Math.sin((54 + i * 72) / 180 * Math.PI) * (p.radius * 0.4));
                }
                ctx.closePath();
                ctx.fill();
                ctx.restore();
            });

            // 3. Draw Carrots
            carrots.forEach(c => {
                ctx.fillStyle = '#f97316';
                ctx.beginPath();
                ctx.moveTo(c.x, c.y - 12);
                ctx.lineTo(c.x + 5, c.y + 10);
                ctx.lineTo(c.x - 5, c.y + 10);
                ctx.fill();
                
                ctx.fillStyle = '#22c55e';
                ctx.beginPath();
                ctx.arc(c.x - 3, c.y + 10, 3, 0, Math.PI*2);
                ctx.arc(c.x + 3, c.y + 10, 3, 0, Math.PI*2);
                ctx.arc(c.x, c.y + 13, 3, 0, Math.PI*2);
                ctx.fill();
            });

            // 4. Draw Enemies
            enemies.forEach(e => {
                ctx.fillStyle = e.color;
                ctx.beginPath();
                ctx.arc(e.x, e.y, e.radius, 0, Math.PI * 2);
                ctx.fill();
                
                if (e.type === 'tank' && e.hp < e.maxHp) {
                    let barW = e.radius * 1.2;
                    let barH = 5;
                    let barX = e.x - barW/2;
                    let barY = e.y - e.radius - 12;
                    
                    ctx.fillStyle = 'rgba(0,0,0,0.5)';
                    ctx.fillRect(barX, barY, barW, barH);
                    ctx.fillStyle = '#eab308';
                    ctx.fillRect(barX, barY, barW * (e.hp / e.maxHp), barH);
                }

                ctx.fillStyle = '#84cc16';
                ctx.beginPath();
                let topY = e.y - e.radius + 2;
                ctx.moveTo(e.x - 5, topY);
                ctx.lineTo(e.x - 12, topY - 10);
                ctx.lineTo(e.x, topY);
                ctx.lineTo(e.x + 12, topY - 10);
                ctx.lineTo(e.x + 5, topY);
                ctx.fill();
                
                let eyeOffsetX = e.radius * 0.35;
                let eyeOffsetY = e.radius * 0.1;
                let eyeSize = e.radius * 0.2;
                
                ctx.fillStyle = 'white';
                ctx.beginPath();
                ctx.arc(e.x - eyeOffsetX, e.y - eyeOffsetY, eyeSize, 0, Math.PI*2);
                ctx.arc(e.x + eyeOffsetX, e.y - eyeOffsetY, eyeSize, 0, Math.PI*2);
                ctx.fill();
                
                ctx.fillStyle = 'black';
                ctx.beginPath();
                ctx.arc(e.x - eyeOffsetX, e.y - eyeOffsetY, eyeSize*0.5, 0, Math.PI*2);
                ctx.arc(e.x + eyeOffsetX, e.y - eyeOffsetY, eyeSize*0.5, 0, Math.PI*2);
                ctx.fill();
                
                ctx.strokeStyle = '#000';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(e.x - eyeOffsetX - eyeSize, e.y - eyeOffsetY - eyeSize);
                ctx.lineTo(e.x - eyeOffsetX + eyeSize, e.y - eyeOffsetY - 2);
                ctx.moveTo(e.x + eyeOffsetX + eyeSize, e.y - eyeOffsetY - eyeSize);
                ctx.lineTo(e.x + eyeOffsetX - eyeSize, e.y - eyeOffsetY - 2);
                ctx.stroke();
            });

            // 5. Draw Particles
            particles.forEach(p => {
                ctx.save();
                ctx.globalAlpha = Math.max(0, p.life);
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
                ctx.fill();
                ctx.restore();
            });

            // 6. Draw Player (Heroic Rabbit)
            let recoilY = player.shootPulse * 1.5;
            let px = player.x;
            let py = player.y + recoilY;

            ctx.save();

            ctx.fillStyle = player.hitFlash > 0 ? '#f87171' : '#f8fafc';
            
            if (weaponLevel > 3) {
                ctx.shadowBlur = 4 * weaponLevel;
                ctx.shadowColor = '#eab308';
            }
            
            ctx.beginPath();
            ctx.ellipse(px - 10, py - 22, 6, 20, -0.2, 0, Math.PI * 2);
            ctx.ellipse(px + 10, py - 22, 6, 20, 0.2, 0, Math.PI * 2);
            ctx.fill();
            
            if (player.hitFlash === 0) {
                ctx.fillStyle = '#f472b6'; 
                ctx.beginPath();
                ctx.ellipse(px - 10, py - 22, 3, 14, -0.2, 0, Math.PI * 2);
                ctx.ellipse(px + 10, py - 22, 3, 14, 0.2, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#f8fafc'; 
            }

            ctx.beginPath();
            ctx.arc(px, py, player.radius, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.fillStyle = '#0f172a'; 
            ctx.beginPath();
            ctx.arc(px - 8, py - 5, 3.5, 0, Math.PI * 2);
            ctx.arc(px + 8, py - 5, 3.5, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.fillStyle = '#f472b6';
            ctx.beginPath();
            ctx.arc(px, py + 2, 2.5, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();

            // 7. Draw Floating Texts
            floatingTexts.forEach(ft => ft.draw(ctx));

            if (shakeAmount > 0) ctx.restore();
        }

        // --- Core Loop ---
        function gameLoop() {
            if (!isPlaying) return;
            update();
            draw();
            animationId = requestAnimationFrame(gameLoop);
        }

        // --- Game Lifecycle ---
        function loseLife() {
            lives--;
            livesDisplay.innerText = lives;
            shakeAmount = 18;
            player.hitFlash = 12;
            playHurt();

            const livesCard = document.getElementById('livesCard');
            livesCard.classList.add('scale-110', 'bg-rose-500/50');
            setTimeout(() => livesCard.classList.remove('scale-110', 'bg-rose-500/50'), 150);

            if (lives <= 0) {
                gameOver();
            }
        }

        function gameOver() {
            isPlaying = false;
            isPaused = false;
            cancelAnimationFrame(animationId);
            playGameOver();
            
            if (bgmSequence) bgmSequence.stop();
            Tone.Transport.stop();
            
            // Show UI
            menu.classList.remove('opacity-0', 'pointer-events-none');
            menuTitle.innerText = "Game Over!";
            menuTitle.className = "text-5xl font-black text-transparent bg-clip-text bg-gradient-to-br from-rose-500 to-red-700 mb-2 text-glow";
            
            menuSubtitle.innerText = "The veggies overran the rabbit patch.";
            instructions.classList.add('hidden'); // Hide instructions on game over
            
            finalScoreContainer.classList.remove('hidden');
            finalScore.innerText = score;
            startBtn.innerText = "RESTART DEFENCE";
            quitBtn.classList.add('hidden'); // Hide quit button
            pauseBtn.classList.add('hidden'); // Hide pause button on HUD
        }

        function clearGameEntities() {
            enemies = [];
            carrots = [];
            particles = [];
            floatingTexts = [];
            powerUps = []; 
        }

        function showStartMenu() {
            menu.classList.remove('opacity-0', 'pointer-events-none');
            menuTitle.innerText = "Carrot Defense";
            menuTitle.className = "text-5xl font-black text-transparent bg-clip-text bg-gradient-to-br from-orange-400 to-rose-500 mb-2 text-glow";
            menuSubtitle.innerText = "Protect the garden from mutant veggies!";
            instructions.classList.remove('hidden');
            
            finalScoreContainer.classList.add('hidden');
            startBtn.innerText = "PLAY GAME";
            quitBtn.classList.add('hidden');
            pauseBtn.classList.add('hidden');
            
            isPaused = false;
            isPlaying = false;
        }

        function pauseGame() {
            if (!isPlaying) return;
            isPlaying = false;
            isPaused = true;
            cancelAnimationFrame(animationId);
            
            Tone.Transport.pause();
            
            menu.classList.remove('opacity-0', 'pointer-events-none');
            menuTitle.innerText = "Paused";
            menuTitle.className = "text-5xl font-black text-slate-100 mb-2 text-glow";
            menuSubtitle.innerText = "Take a breather. The garden is waiting.";
            instructions.classList.add('hidden');
            
            finalScoreContainer.classList.add('hidden');
            startBtn.innerText = "RESUME DEFENCE";
            quitBtn.classList.remove('hidden');
            pauseBtn.classList.add('hidden'); // Hide while menu is open
        }

        function resumeGame() {
            isPaused = false;
            isPlaying = true;
            menu.classList.add('opacity-0', 'pointer-events-none');
            quitBtn.classList.add('hidden');
            pauseBtn.classList.remove('hidden');
            
            if (Tone.context.state !== 'running') {
                Tone.context.resume();
            }
            Tone.Transport.start();
            
            gameLoop();
        }

        function startGame() {
            // Reset state
            score = 0;
            lives = 10; 
            frames = 0;
            spawnRate = 60;
            weaponLevel = 3; 
            shakeAmount = 0;
            
            clearGameEntities();
            
            // Reset Player
            player.x = canvas.width / 2;
            player.targetX = player.x;
            
            // Update UI
            scoreDisplay.innerText = score;
            livesDisplay.innerText = lives;
            menu.classList.add('opacity-0', 'pointer-events-none');
            finalScoreContainer.classList.add('hidden');
            pauseBtn.classList.remove('hidden'); // Show HUD pause button
            
            if (bgmSequence) bgmSequence.start(0);
            Tone.Transport.start();

            // Start Engine
            isPlaying = true;
            isPaused = false;
            if(animationId) cancelAnimationFrame(animationId);
            gameLoop();
        }

        // --- Interactions ---
        
        pauseBtn.addEventListener('click', (e) => {
            e.stopPropagation(); // prevent canvas touch/click
            pauseGame();
        });

        quitBtn.addEventListener('click', () => {
            clearGameEntities();
            player.x = canvas.width / 2;
            showStartMenu();
            draw(); // Redraw clean background
        });

        startBtn.addEventListener('click', async () => {
            if (!audioInitialized) {
                try {
                    await Tone.start();
                    initAudio();
                    audioInitialized = true;
                } catch(e) {
                    console.log("Audio contexts couldn't start yet: ", e);
                }
            }
            
            if (isPaused) {
                resumeGame();
            } else {
                startGame();
            }
        });

        // Initial setup and draw
        resize();
        draw();

    </script>
</body>
</html>
